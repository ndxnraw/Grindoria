name: Build Windows installer
on:
  push:
    branches: [main]
    paths: ['package.json', 'package-lock.json', 'electron-builder.json', 'desktop/**', 'build/**', 'dist/**', 'scripts/desktop-smoke.mjs', 'scripts/verify-desktop.mjs', '.github/workflows/desktop.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: grindoria-desktop-release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run check:dist
      - run: npm test
      - name: Build NSIS installer
        run: npm run desktop:dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
      - run: npm run desktop:verify
      - name: Test packaged game and saves
        run: npm run desktop:smoke
      - uses: actions/upload-artifact@v7
        with:
          name: Grindoria-Windows
          path: |
            release/Grindoria-Setup-*.exe
            release/Grindoria-Setup-*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
      - name: Publish versioned GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          gh release view $tag --repo ndxnraw/Grindoria *> $null
          if ($LASTEXITCODE -eq 0) { Write-Output "Release $tag already exists; keeping its assets."; exit 0 }
          node scripts/desktop-release-notes.mjs > work/release-notes.md
          gh release create $tag --repo ndxnraw/Grindoria --target $env:GITHUB_SHA --title "Grindoria $version" --notes-file work/release-notes.md --latest "release/Grindoria-Setup-$version-x64.exe" "release/Grindoria-Setup-$version-x64.exe.blockmap" release/latest.yml
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed." }
